<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivilBridge — Group</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --steel: #1a2332;
    --concrete: #8a9aaa;
    --gold: #c9a96e;
    --light: #f0ece4;
    --white: #fafaf8;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--steel);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  .page {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    grid-template-columns: 1fr 1fr;
    position: relative;
    overflow: hidden;
  }

  /* Architectural grid lines */
  .grid-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .grid-lines::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(201,169,110,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridFade 3s ease forwards;
    opacity: 0;
  }

  @keyframes gridFade {
    to { opacity: 1; }
  }

  /* Bridge structure diagonal */
  .bridge-line {
    position: absolute;
    width: 140%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), rgba(201,169,110,0.6), rgba(201,169,110,0.3), transparent);
    top: 50%;
    left: -20%;
    transform: rotate(-8deg);
    z-index: 0;
    animation: lineReveal 2s ease 0.5s both;
  }

  .bridge-line::before, .bridge-line::after {
    content: '';
    position: absolute;
    width: 1px;
    height: 200px;
    background: linear-gradient(to bottom, rgba(201,169,110,0.6), transparent);
    top: 0;
  }
  .bridge-line::before { left: 30%; transform: rotate(8deg); }
  .bridge-line::after { left: 70%; transform: rotate(8deg); }

  @keyframes lineReveal {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0% 0 0); }
  }

  /* Top-left: Project title */
  .title-block {
    grid-column: 1;
    grid-row: 1;
    padding: 8vh 8vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    z-index: 2;
    animation: slideUp 1s ease 0.3s both;
  }

  .tag {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(10px, 1.2vw, 14px);
    font-weight: 300;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2vh;
  }

  .project-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(52px, 8vw, 110px);
    font-weight: 900;
    color: var(--white);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  .project-name span {
    display: block;
    color: var(--gold);
  }

  /* Top-right: decorative */
  .deco-block {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 8vh 8vw;
    animation: slideUp 1s ease 0.5s both;
  }

  .circle-deco {
    width: clamp(80px, 12vw, 160px);
    height: clamp(80px, 12vw, 160px);
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.4);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-deco::before {
    content: '';
    width: 70%;
    height: 70%;
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.2);
    position: absolute;
  }

  .circle-text {
    font-size: clamp(8px, 0.9vw, 11px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--concrete);
    text-align: center;
    line-height: 1.6;
  }

  /* Center divider */
  .center-divider {
    grid-column: 1 / -1;
    grid-row: 2;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    padding: 0 8vw;
    gap: 3vw;
    animation: slideUp 1s ease 0.7s both;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .divider-label {
    font-size: clamp(9px, 1vw, 12px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--concrete);
    white-space: nowrap;
  }

  /* Bottom: members */
  .members-block {
    grid-column: 1 / -1;
    grid-row: 3;
    padding: 6vh 8vw 8vh;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3vw;
    position: relative;
    z-index: 2;
    align-items: start;
  }

  .member {
    animation: memberReveal 0.8s ease both;
  }

  .member:nth-child(1) { animation-delay: 0.9s; }
  .member:nth-child(2) { animation-delay: 1.05s; }
  .member:nth-child(3) { animation-delay: 1.2s; }
  .member:nth-child(4) { animation-delay: 1.35s; }

  @keyframes memberReveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .member-number {
    font-size: clamp(9px, 0.9vw, 11px);
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-bottom: 1.5vh;
    font-weight: 300;
  }

  .member-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(15px, 1.8vw, 24px);
    color: var(--white);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 0.8vh;
  }

  .member-bar {
    width: 30px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
    margin-top: 1.5vh;
    transition: width 0.4s ease;
  }

  .member:hover .member-bar {
    width: 60px;
    opacity: 1;
  }

  .member:hover .member-name {
    color: var(--gold);
    transition: color 0.3s ease;
  }

  /* Bottom right: year stamp */
  .year-stamp {
    position: absolute;
    bottom: 8vh;
    right: 8vw;
    z-index: 3;
    text-align: right;
    animation: slideUp 1s ease 1.5s both;
  }

  .year {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 5vw, 72px);
    color: rgba(201,169,110,0.12);
    font-weight: 900;
    line-height: 1;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 150px 150px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="grid-lines"></div>
  <div class="bridge-line"></div>
  <div class="noise"></div>

  <!-- Title -->
  <div class="title-block">
    <div class="tag">Group Project — 2025</div>
    <h1 class="project-name">
      Civil<span>Bridge</span>
    </h1>
  </div>

  <!-- Decorative circle -->
  <div class="deco-block">
    <div class="circle-deco">
      <div class="circle-text">Engineering<br>&amp;<br>Innovation</div>
    </div>
  </div>

  <!-- Divider -->
  <div class="center-divider">
    <div class="divider-line"></div>
    <div class="divider-label">Group Members</div>
    <div class="divider-line"></div>
  </div>

  <!-- Members -->
  <div class="members-block">
    <div class="member">
      <div class="member-number">01</div>
      <div class="member-name">Nizeyimana<br>Samuel</div>
      <div class="member-bar"></div>
    </div>
    <div class="member">
      <div class="member-number">02</div>
      <div class="member-name">Izere<br>Marie Ange</div>
      <div class="member-bar"></div>
    </div>
    <div class="member">
      <div class="member-number">03</div>
      <div class="member-name">Akimana<br>Aline</div>
      <div class="member-bar"></div>
    </div>
    <div class="member">
      <div class="member-number">04</div>
      <div class="member-name">Dushimimana<br>Fabrice</div>
      <div class="member-bar"></div>
    </div>
  </div>

  <div class="year-stamp">
    <div class="year">2025</div>
  </div>
</div>
</body>
</html>
